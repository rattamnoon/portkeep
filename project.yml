name: Burrow
options:
  bundleIdPrefix: com.rattamnoon
  deploymentTarget:
    macOS: "14.0"
packages:
  TunnelKit:
    path: .
targets:
  Burrow:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: TunnelKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rattamnoon.burrow
        PRODUCT_NAME: Burrow
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: App/Resources/Burrow.entitlements
        INFOPLIST_FILE: App/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
