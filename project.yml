name: Portkeep
options:
  bundleIdPrefix: com.rattamnoon
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
packages:
  TunnelKit:
    path: .
targets:
  Portkeep:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: TunnelKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rattamnoon.portkeep
        PRODUCT_NAME: Portkeep
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: App/Resources/Portkeep.entitlements
        INFOPLIST_FILE: App/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
  PortkeepUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests
    dependencies:
      - target: Portkeep
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rattamnoon.portkeep.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: Portkeep
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
schemes:
  Portkeep:
    build:
      targets:
        Portkeep: all
    test:
      targets:
        - PortkeepUITests
