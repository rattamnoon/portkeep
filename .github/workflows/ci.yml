name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (TunnelKit)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Test
        run: swift test

  app:
    name: Build app and UI smoke tests
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build
        run: xcodebuild build -scheme Burrow -destination 'platform=macOS' -derivedDataPath build
      - name: UI smoke tests
        run: |
          xcodebuild test -scheme Burrow -destination 'platform=macOS' -derivedDataPath build \
            -resultBundlePath build/ui-tests.xcresult
      - name: Upload UI test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-tests-xcresult
          path: build/ui-tests.xcresult
